name: resida

services:
  web:
    image: resida:1.3.34
    env_file:
      - /DATA/AppData/resida/.env
    environment:
      ACCESS_TOKEN_EXPIRE_MINUTES: "43200"
    ports:
      - "8082:8080"
    volumes:
      - type: bind
        source: /DATA/AppData/resida/uploads
        target: /app/uploads
    networks:
      - saa-pos_saa
    restart: unless-stopped

networks:
  saa-pos_saa:
    external: true

x-casaos:
  id: com.rukun.community
  main: web
  index: /
  port_map: "8082"
  scheme: http
  icon: https://rukun.asabiz.id/icons/rukun-app-512.png?v=20260912-2
  thumbnail: https://rukun.asabiz.id/icons/rukun-app-512.png?v=20260912-2
  title:
    custom: RUKUN
    en_US: RUKUN
    en_us: RUKUN
    id_ID: RUKUN
  tagline:
    en_US: Residential community management platform
    en_us: Residential community management platform
    id_ID: Platform manajemen komunitas perumahan
  description:
    en_US: >-
      RUKUN is a progressive web application for residential communities.
      It centralizes resident registration and verification, announcements,
      facility bookings, letters, voting, purchase requests, management reports, profiles, and document uploads.
    en_us: >-
      RUKUN is a progressive web application for residential communities.
      It centralizes resident registration and verification, announcements,
      facility bookings, letters, voting, purchase requests, management reports, profiles, and document uploads.
    id_ID: >-
      RUKUN adalah aplikasi web progresif untuk komunitas perumahan yang
      memusatkan registrasi dan verifikasi penghuni, pengumuman, pemesanan
      fasilitas, surat, voting, permintaan pembelian, laporan pengelola, profil, dan unggahan dokumen.
  author: SAA RUKUN
  developer: SAA RUKUN
  category: Productivity
  architectures:
    - amd64
  version: "1.3.34"
  update_at: "2026-10-17"
  release_notes:
    en_US: Adds existing upload previews, owner-controlled soft deletion, and file re-upload across forms.
    en_us: Adds existing upload previews, owner-controlled soft deletion, and file re-upload across forms.
    id_ID: "Menambahkan preview file tersimpan, soft delete oleh pemilik file, dan upload ulang pada seluruh form terkait."
  website: https://rukun.asabiz.id
  support: https://rukun.asabiz.id/docs
  docs: https://rukun.asabiz.id/docs
  store_app_id: rukun
  tips:
    before_install:
      en_US: RUKUN uses the existing MySQL server and persists uploads in /DATA/AppData/resida/uploads.
      en_us: RUKUN uses the existing MySQL server and persists uploads in /DATA/AppData/resida/uploads.
      id_ID: RUKUN memakai server MySQL existing dan menyimpan unggahan di /DATA/AppData/resida/uploads.
